[project]
name = "stock_helper"
version = "0.1.0"
description = "Stock module - news fetching, search, and data services"
requires-python = ">=3.12"
dependencies = [
    "common>=0.1.0",
    "pydantic>=2.0",
    "websockets>=12.0",
    "python-socks>=2.5.3",
    "loguru>=0.7",
    "requests>=2.31",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_helper"]
