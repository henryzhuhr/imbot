[project]
name = "imbot-workspace"
version = "0.1.0"
description = "News monitoring bot - monorepo workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "newsfetcher",
    "imbot",
]

[tool.uv.sources]
newsfetcher = { workspace = true }
imbot = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
