[project]
name = "imbot-workspace"
version = "0.1.0"
description = "News monitoring bot - monorepo workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "common",
    "newsfetcher",
    "imbot",
    "stock_helper",
    "requests>=2.32.5",
]

[tool.uv.sources]
common = { workspace = true }
newsfetcher = { workspace = true }
imbot = { workspace = true }
stock_helper = { workspace = true }
[tool.uv.workspace]
members = ["packages/*"]

[[tool.uv.index]]
url = "https://mirrors.ustc.edu.cn/pypi/simple"


[[tool.uv.index]]
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.3",
]
